<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sommaire des cours – Couverture et zinguerie – Campus de Vannes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bleu:#003566; --jaune:#FFD707; --gris:#575757; --noir:#000;
  --fond:#FFFFFF; --texte:#3d3d3d; --titre:#003566; --bord:#DDDEDF; --pointille:#b9bbbd; --survol:rgba(255,215,7,.18);
  --titres:"Gobold","Oswald","Arial Narrow",Arial,sans-serif;
  --corps:"Montserrat",Verdana,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --fond:#0f1a26; --texte:#e6e8ea; --titre:#ffffff; --bord:#2c4560; --pointille:#3e5a78; --survol:rgba(255,215,7,.12); color-scheme:dark; }
}
:root[data-theme="dark"]{ --fond:#0f1a26; --texte:#e6e8ea; --titre:#ffffff; --bord:#2c4560; --pointille:#3e5a78; --survol:rgba(255,215,7,.12); color-scheme:dark; }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--fond);font-family:var(--corps);color:var(--texte);font-size:clamp(15px,.4vw + 13px,17px);line-height:1.45;
  min-height:100vh;display:flex;flex-direction:column}

/* En-tête */
header{background:var(--bleu);color:#fff;border-bottom:4px solid var(--jaune);
  padding:calc(env(safe-area-inset-top,0px) + .7rem) 1rem .7rem}
.entete{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.logo{height:46px;width:auto;display:block}
.entete-txt{padding-left:1rem;border-left:2px solid var(--jaune)}
h1{font-family:var(--titres);text-transform:uppercase;font-weight:700;letter-spacing:.03em;font-size:1.6rem;line-height:1}
.sous-titre{font-size:.82em;opacity:.9;margin-top:.15rem}
@media (max-width:560px){.logo{height:38px}h1{font-size:1.3rem}.entete-txt{padding-left:.7rem}}

main{flex:1;max-width:860px;width:100%;margin:0 auto;padding:1.2rem 1rem 2rem}

/* Accès rapide aux thèmes + recherche */
.outils{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1.4rem}
.raccourcis{display:flex;flex-wrap:wrap;gap:.35rem;flex:1 1 100%}
.raccourcis a{font-size:.85em;font-weight:600;text-decoration:none;color:var(--titre);border:2px solid var(--bleu);border-radius:999px;padding:.2rem .75rem;min-height:36px;display:inline-flex;align-items:center}
.raccourcis a:hover{background:var(--bleu);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .raccourcis a{border-color:#5d86b3}}
.recherche{flex:1 1 100%;min-height:40px;font:inherit;padding:.4rem .8rem;border:2px solid var(--bord);border-radius:6px;background:var(--fond);color:var(--texte)}
a:focus-visible,.recherche:focus-visible{outline:3px solid var(--jaune);outline-offset:2px}

/* Sommaire */
.theme{margin-bottom:1.5rem}
.theme h2{display:flex;align-items:baseline;gap:.7rem;font-family:var(--titres);text-transform:uppercase;font-weight:700;letter-spacing:.02em;
  color:var(--titre);font-size:1.35rem;line-height:1.1;padding-bottom:.35rem;border-bottom:3px solid var(--bleu)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme h2{border-bottom-color:var(--jaune)}}
.theme h2 .num{display:inline-flex;align-items:center;justify-content:center;min-width:2rem;height:2rem;background:var(--jaune);color:var(--noir);font-size:1.15rem;border-radius:3px;flex:none}
.theme ol{list-style:none}
.ligne a{display:flex;align-items:baseline;gap:.5rem;text-decoration:none;color:inherit;padding:.5rem .4rem;border-bottom:1px solid var(--bord)}
.ligne a:hover{background:var(--survol)}
.ligne .rep{font-weight:700;color:var(--titre);min-width:2.3rem;flex:none}
.ligne .intitule{font-weight:600;color:var(--titre)}
.ligne .desc{display:block;font-weight:400;font-size:.82em;color:var(--texte)}
.ligne .points{flex:1;border-bottom:2px dotted var(--pointille);min-width:1rem;transform:translateY(-.3em)}
.niveaux{display:flex;gap:.25rem;flex:none}
.niv{font-weight:700;font-size:.7em;padding:.05rem .4rem;border-radius:3px;white-space:nowrap}
.niv-CAP{background:var(--jaune);color:var(--noir)}
.niv-BP{background:var(--bleu);color:#fff}
.niv-CS{background:var(--gris);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .niv-BP{background:#2f6aa6}}
@media (max-width:560px){.ligne a{flex-wrap:wrap}.ligne .texte{flex:1 1 calc(100% - 3rem)}.ligne .points{display:none}.niveaux{margin-left:2.8rem}}
.vide{padding:.8rem;border:2px dashed var(--bord);border-radius:6px}

footer{background:var(--bleu);color:#fff;padding:.6rem 1rem calc(env(safe-area-inset-bottom,0px) + .6rem);font-size:.8em;border-top:3px solid var(--jaune)}
footer div{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem}
</style>
</head>

    const li=document.createElement('li'); li.className='ligne';
    li.dataset.texte=sansAccent(t.nom+' '+c.titre+' '+c.desc);
    li.innerHTML=`<a href="${encodeURI(c.fichier)}"><span class="rep">${n}.${i+1}</span><span class="texte"><span class="intitule">${c.titre}</span><span class="desc">${c.desc}</span></span><span class="points"></span><span class="niveaux">${c.niveaux.map(x=>`<span class="niv niv-${x}">${NOMS[x]}</span>`).join('')}</span></a>`;
    ol.appendChild(li);
  });
  sommaire.appendChild(sec);
  const a=document.createElement('a'); a.href='#'+t.id; a.textContent=n+'. '+t.nom; raccourcis.appendChild(a);
});

champ.addEventListener('input',()=>{
  const q=sansAccent(champ.value.trim()); let total=0;
  document.querySelectorAll('.theme').forEach(sec=>{
    let k=0;
    sec.querySelectorAll('.ligne').forEach(li=>{const ok=!q||li.dataset.texte.includes(q);li.hidden=!ok;if(ok)k++;});
    sec.hidden=k===0; total+=k;
  });
  vide.hidden=total>0;
});
</script>
</body>
</html>
